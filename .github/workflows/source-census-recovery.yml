name: Source census recovery
on:
  pull_request:
    types: [opened, synchronize]
    paths: ["src/**", ".github/workflows/source-census-recovery.yml"]
permissions:
  contents: read
jobs:
  census:
    if: github.event.pull_request.number == 321
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Inspect changed source modules without repository writes
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { inspectModule } from "./scripts/audit-v4-surfaces.mjs";
          const paths = ["src/components/sheet/tdv2-creation-loom.tsx","src/components/sheet/tdv2-fields.tsx","src/components/sheet/tdv2-sheet.tsx","src/routes/sheet.$id_.power.tsx"];
          const files = paths.map(path => { const source = readFileSync(path,"utf8"); return {path,sha256:createHash("sha256").update(source).digest("hex"),info:inspectModule(source,path)}; });
          const encoded=Buffer.from(JSON.stringify({source:process.env.SOURCE_SHA,files})).toString("base64");
          for(let i=0;i<encoded.length;i+=8000) console.log("CENSUS_DELTA_"+String(i/8000).padStart(4,"0")+":"+encoded.slice(i,i+8000));
          JS
